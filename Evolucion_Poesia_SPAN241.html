<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolución de la poesía · SPAN 241</title>
<style>
:root{
  --bg:#0B1020; --gold:#D9B66F; --ink:#F4F1EA;
  --mute:rgba(244,241,234,.62); --dim:rgba(244,241,234,.36);
  --serif:"Cormorant Garamond","EB Garamond",Garamond,"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Baskerville,Georgia,serif;
  --sans:"Helvetica Neue","Segoe UI",Inter,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#060913}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
body:not(.show){cursor:none}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(ellipse 85% 75% at 62% 46%,#141b35 0%,#0B1020 58%,#080c18 100%)}
#scenes,#fx{position:absolute;inset:0}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.42) 100%)}
.scene{position:absolute;inset:0;will-change:opacity,clip-path}

/* text column */
.col{position:absolute;left:150px;top:110px;width:680px;height:860px;display:flex;flex-direction:column;justify-content:center}
.label{display:flex;align-items:center;gap:18px;font:600 21px/1 var(--sans);letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
.label i{display:block;width:56px;height:2px;background:var(--gold)}
.period{font:400 20px/1 var(--sans);letter-spacing:.14em;color:var(--mute);margin-top:18px}
.main{text-wrap:balance;font:400 88px/1.04 var(--serif);color:var(--ink);margin-top:52px}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .03em .17em;margin-bottom:-.13em}
.w>span{display:inline-block}
.sub{font:400 24px/1.35 var(--sans);color:var(--mute);margin-top:18px}
.author{font:italic 400 36px/1.2 var(--serif);color:var(--ink);margin-top:42px}
.work{font:400 21px/1.4 var(--sans);color:var(--mute);margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:16px 30px;margin-top:40px}
.chip{display:flex;align-items:center;gap:12px;font:600 19px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}

/* visual region */
.vis{position:absolute;left:880px;top:90px;width:900px;height:900px}
.vis>svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
svg.full{position:absolute;inset:0;width:100%;height:100%}
.fb{transform-box:fill-box;transform-origin:center}
.sv-serif{font-family:var(--serif)}
.sv-serif-i{font-family:var(--serif);font-style:italic}
.sv-sans{font-family:var(--sans)}
.sv-sans-b{font-family:var(--sans);font-weight:600}

/* scene 5 tokens */
.toks{position:absolute;inset:0}
.tok{position:absolute;left:0;top:0;font:600 18px/1 var(--sans);letter-spacing:.1em;color:var(--ink);white-space:nowrap;transform-origin:50% 50%}

/* scene 6 */
.s6lab{position:absolute;top:150px;left:0;right:0;justify-content:center}
.s6n{position:absolute;top:318px;transform:translateX(-50%);font:600 21px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.s6k{position:absolute;top:420px;transform:translateX(-50%);font:400 40px/1 var(--serif);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.s6c{position:absolute;top:540px;left:210px;width:1500px;text-align:center;text-wrap:balance;font:400 60px/1.12 var(--serif);color:var(--ink)}
.s6q{position:absolute;top:782px;left:0;right:0;justify-content:center;font-size:17px}
.s6qq{position:absolute;top:830px;left:260px;width:1400px;text-align:center;text-wrap:balance;font:italic 400 46px/1.2 var(--serif);color:var(--ink)}
.s6qq .w{padding-right:.1em;margin-right:-.07em}

/* transitions */
.sweep{position:absolute;left:0;top:0;background:var(--gold);box-shadow:0 0 28px 5px rgba(217,182,111,.5);opacity:0}
.sweep.v{width:2px;height:1080px}
.sweep.h{width:1920px;height:2px}

/* movement nav */
#nav{position:absolute;top:58px;right:84px;display:flex;gap:28px;font:600 12.5px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase}

/* controls */
#ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:rgba(11,16,32,.78);border:1px solid rgba(217,182,111,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transition:opacity .45s;z-index:10;font:500 11px/1 var(--sans);color:var(--mute)}
body.show #ui{opacity:1}
#ui button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
#ui button:hover,#ui button:focus-visible{background:rgba(217,182,111,.16);color:var(--gold)}
#ui svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar{position:relative;width:240px;height:3px;margin:0 10px;background:rgba(244,241,234,.16);border-radius:2px;cursor:pointer}
#bar::after{content:"";position:absolute;inset:-10px 0}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);border-radius:2px}
.tick{position:absolute;top:-3px;width:1px;height:9px;background:rgba(244,241,234,.35)}
#sname{min-width:150px;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body class="show">
<div id="stage">
  <div id="scenes"></div>
  <div id="fx"></div>
  <div id="nav"></div>
  <div class="vignette"></div>
</div>

<div id="ui">
  <button id="bRestart" title="Reiniciar (R)" aria-label="Reiniciar"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4.5H9"/></svg></button>
  <button id="bPrev" title="Escena anterior (←)" aria-label="Escena anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button id="bPlay" title="Pausar / reproducir (espacio)" aria-label="Pausar o reproducir"><svg viewBox="0 0 24 24"><g id="icPause"><path d="M9 6v12M15 6v12"/></g><g id="icPlay" style="display:none"><path d="M8 5.5l10.5 6.5L8 18.5z" fill="currentColor"/></g></svg></button>
  <button id="bNext" title="Escena siguiente (→)" aria-label="Escena siguiente"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <div id="bar"><div id="fill"></div></div>
  <span id="sname"></span>
  <button id="bFull" title="Pantalla completa (F)" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const GOLD = '#D9B66F', INK = '#F4F1EA', BG = '#0B1020';
const TOTAL = 63;
const STARTS = [0, 10, 20, 30, 40, 50];
const NAMES = ['Renacimiento', 'Barroco', 'Romanticismo', 'Modernismo', 'Vanguardias', 'Síntesis'];
const EO = 'cubic-bezier(.22,.61,.36,1)', EIO = 'cubic-bezier(.65,0,.35,1)',
      EI = 'cubic-bezier(.55,.05,.75,.3)', LIN = 'linear', POP = 'cubic-bezier(.34,1.56,.64,1)';

const anims = [];
const stage = document.getElementById('stage');
const scenesEl = document.getElementById('scenes');
const fxEl = document.getElementById('fx');

/* ---------- helpers ---------- */
function S(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function H(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
/* One animation per element/property-set on a single global timeline.
   frames: [[time, {props}, easingToNext], ...]; base = scene start. */
function K(el, frames, base = 0) {
  const ts = frames.map(f => f[0] + base);
  const t0 = ts[0], t1 = ts[ts.length - 1], dur = Math.max(t1 - t0, 0.01);
  const kf = frames.map((f, i) => Object.assign({}, f[1], { offset: (ts[i] - t0) / dur, easing: f[2] || EO }));
  const a = el.animate(kf, {
    delay: t0 * 1000, duration: dur * 1000,
    endDelay: Math.max(0, (TOTAL - t1) * 1000), fill: 'both'
  });
  a.pause(); anims.push(a); return a;
}
function draw(el, t0, t1, base, ease = EO) {
  el.setAttribute('pathLength', 1);
  el.setAttribute('stroke-dasharray', '1 1');
  K(el, [[t0, { strokeDashoffset: 1 }, ease], [t1, { strokeDashoffset: 0 }]], base);
}
function rise(el, t, base, d = 1, dy = 24) {
  K(el, [[t, { opacity: 0, transform: `translateY(${dy}px)` }], [t + d, { opacity: 1, transform: 'translateY(0px)' }]], base);
}
function words(el, text) {
  el.innerHTML = '';
  const spans = [];
  text.split(' ').forEach(w => {
    const o = H('span', 'w', el);
    spans.push(H('span', '', o, w));
    el.appendChild(document.createTextNode(' '));
  });
  return spans;
}
function revealWords(spans, t, base, step = .14) {
  spans.forEach((s, i) => K(s, [
    [t + i * step, { opacity: 0, transform: 'translateY(105%)' }],
    [t + i * step + .9, { opacity: 1, transform: 'translateY(0%)' }]
  ], base));
}
function svgIn(parent, vb = '0 0 900 900') {
  const s = S('svg', { viewBox: vb }, parent);
  return [s, S('defs', null, s)];
}
function glow(defs, id, std) {
  const f = S('filter', { id, x: '-60%', y: '-60%', width: '220%', height: '220%' }, defs);
  S('feGaussianBlur', { stdDeviation: std, result: 'b' }, f);
  const m = S('feMerge', null, f);
  S('feMergeNode', { in: 'b' }, m); S('feMergeNode', { in: 'SourceGraphic' }, m);
}
function grad(defs, id, type, stops, attrs = {}) {
  const g = S(type, Object.assign({ id }, attrs), defs);
  stops.forEach(([o, c, op]) => S('stop', { offset: o, 'stop-color': c, 'stop-opacity': op == null ? 1 : op }, g));
}
function stxt(svg, x, y, txt, cls, size, fill, extra = {}) {
  const t = S('text', Object.assign({ x, y, 'text-anchor': 'middle', class: cls, 'font-size': size, fill }, extra), svg);
  t.textContent = txt; return t;
}
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* scene container: mask in, blur/fade out */
function scene(i, hid, shown, op0 = 1) {
  const el = H('div', 'scene', scenesEl);
  const s = STARTS[i], n = STARTS[i + 1];
  const on = { opacity: 1, filter: 'blur(0px)', transform: 'scale(1)', clipPath: shown };
  const f = [[s, { opacity: op0, filter: 'blur(0px)', transform: 'scale(1)', clipPath: hid }, EIO], [s + 1, on]];
  if (n != null) {
    f.push([n, on, EIO]);
    f.push([n + .8, { opacity: 0, filter: 'blur(10px)', transform: 'scale(1.035)', clipPath: shown }]);
  }
  K(el, f);
  return el;
}
function sweep(t, dir) {
  const e = H('div', 'sweep ' + (dir === 'up' ? 'h' : 'v'), fxEl);
  const A = { right: ['translateX(0px)', 'translateX(1920px)'], left: ['translateX(1920px)', 'translateX(0px)'], up: ['translateY(1080px)', 'translateY(0px)'] }[dir];
  K(e, [[t, { transform: A[0] }, EIO], [t + 1, { transform: A[1] }]]);
  K(e, [[t, { opacity: 0 }], [t + .06, { opacity: 1 }], [t + .9, { opacity: 1 }], [t + 1.05, { opacity: 0 }]]);
}
/* left text column shared by scenes 1–5 */
function column(sc, o, b) {
  const col = H('div', 'col', sc);
  const lab = H('div', 'label', col, `<i></i>${o.num} · ${o.mov}`);
  const per = H('div', 'period', col, o.period);
  const main = H('div', 'main', col);
  const ws = words(main, o.main);
  const sub = o.sub ? H('div', 'sub', col, o.sub) : null;
  const au = H('div', 'author', col, o.author);
  const wk = o.work ? H('div', 'work', col, o.work) : null;
  const chips = H('div', 'chips', col);
  const cs = (o.chips || []).map(c => H('div', 'chip', chips, c));
  rise(lab, .25, b); rise(per, .5, b);
  rise(au, o.tAuthor, b); if (wk) rise(wk, o.tAuthor + .25, b);
  revealWords(ws, o.tMain, b);
  if (sub) rise(sub, o.tSub, b);
  cs.forEach((c, i) => rise(c, o.tChips[i], b, .8, 16));
}

/* =========================================================
   ESCENA 1 — RENACIMIENTO
   ========================================================= */
function s1() {
  const b = STARTS[0];
  const sc = scene(0, 'inset(0% 0% 0% 0%)', 'inset(0% 0% 0% 0%)', 0);
  column(sc, {
    num: '01', mov: 'Renacimiento', period: 'Siglo XVI',
    main: 'La belleza es pasajera.', tMain: 6.0,
    author: 'Garcilaso de la Vega', work: 'Soneto XXIII · «En tanto que de rosa y azucena»', tAuthor: 1.0,
    chips: ['Ideal de belleza', 'Naturaleza', 'Carpe diem', 'Paso del tiempo'], tChips: [3.6, 4.3, 5.0, 6.8]
  }, b);

  const v = H('div', 'vis', sc);
  const [s, d] = svgIn(v);
  glow(d, 'g1', 5);
  grad(d, 'pg1', 'radialGradient', [[0, GOLD, .6], [1, GOLD, .06]], { cx: '50%', cy: '100%', r: '100%' });
  const C = S('g', { transform: 'translate(450,390)' }, s);

  const faint = S('circle', { r: 300, fill: 'none', stroke: 'rgba(217,182,111,.13)', 'stroke-width': 1.2 }, C);
  K(faint, [[.4, { opacity: 0 }], [1.4, { opacity: 1 }]], b);
  const ticks = S('g', null, C);
  for (let k = 0; k < 12; k++) {
    const a = k * Math.PI / 6, r2 = k % 3 ? 324 : 334;
    S('path', { d: `M${(Math.sin(a) * 314).toFixed(1)},${(-Math.cos(a) * 314).toFixed(1)} L${(Math.sin(a) * r2).toFixed(1)},${(-Math.cos(a) * r2).toFixed(1)}`,
      stroke: 'rgba(244,241,234,.38)', 'stroke-width': k % 3 ? 1.2 : 2 }, ticks);
  }
  K(ticks, [[.6, { opacity: 0 }], [1.6, { opacity: 1 }]], b);

  const stem = S('path', { d: 'M0,20 C12,150 -16,290 4,440', fill: 'none', stroke: GOLD, 'stroke-width': 2.2, 'stroke-linecap': 'round' }, C);
  draw(stem, .5, 2.1, b);
  const leaf = S('path', { d: 'M3,300 C40,262 92,262 122,236 C98,292 46,312 3,300Z', fill: 'url(#pg1)', stroke: GOLD, 'stroke-width': 1.4, class: 'fb' }, C);
  K(leaf, [[1.6, { opacity: 0, transform: 'scale(.2)' }], [2.6, { opacity: 1, transform: 'scale(1)' }]], b);

  const petal = (L, W) => `M0,0 C${W * .55},${-L * .18} ${W},${-L * .72} 0,${-L} C${-W},${-L * .72} ${-W * .55},${-L * .18} 0,0Z`;
  const rings = [{ n: 6, L: 150, W: 92, o: 0 }, { n: 5, L: 112, W: 70, o: 36 }, { n: 4, L: 72, W: 46, o: 45 }];
  const falls = [];
  rings.forEach((r, ri) => {
    const g = S('g', null, C);
    for (let k = 0; k < r.n; k++) {
      const f = S('g', { class: 'fb' }, g);
      const rg = S('g', { transform: `rotate(${r.o + k * 360 / r.n})` }, f);
      S('path', { d: petal(r.L, r.W), fill: 'url(#pg1)', stroke: GOLD, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, rg);
      if (ri === 0) falls.push(f);
    }
    const t = 1.0 + (2 - ri) * .45;
    K(g, [[t, { opacity: 0, transform: 'scale(.12) rotate(-50deg)' }], [t + 2.2, { opacity: 1, transform: 'scale(1) rotate(0deg)' }]], b);
  });
  const core = S('circle', { r: 13, fill: GOLD, class: 'fb' }, C);
  K(core, [[1.0, { opacity: 0, transform: 'scale(0)' }], [1.8, { opacity: 1, transform: 'scale(1)' }]], b);

  // the luminous circle of time
  const circ = S('path', { d: 'M0,-300 A300,300 0 1 1 0,300 A300,300 0 1 1 0,-300', fill: 'none', stroke: GOLD, 'stroke-width': 2.6, filter: 'url(#g1)' }, C);
  draw(circ, 1.0, 9.4, b, LIN);
  const dot = S('g', null, C);
  S('circle', { cx: 0, cy: -300, r: 7, fill: '#F6E6B8', filter: 'url(#g1)' }, dot);
  K(dot, [[1.0, { opacity: 0, transform: 'rotate(0deg)' }, LIN], [1.3, { opacity: 1, transform: 'rotate(12.857deg)' }, LIN], [9.4, { opacity: 1, transform: 'rotate(360deg)' }]], b);

  // petals fall
  [3, 1, 5, 0, 4, 2].forEach((k, j) => {
    const t = 5.2 + j * .6, a = k * Math.PI / 3;
    const dx = Math.sin(a) * 60 + (j % 2 ? 34 : -34), dy = 320 + j * 18, rot = (j % 2 ? 1 : -1) * (60 + j * 15);
    K(falls[k], [[t, { opacity: 1, transform: 'translate(0px,0px) rotate(0deg)' }, EI],
                 [t + 2.8, { opacity: 0, transform: `translate(${dx.toFixed(1)}px,${dy}px) rotate(${rot}deg)` }]], b);
  });
}

/* =========================================================
   ESCENA 2 — BARROCO
   ========================================================= */
function s2() {
  const b = STARTS[1];
  const sc = scene(1, 'inset(0% 100% 0% 0%)', 'inset(0% 0% 0% 0%)');
  sweep(b, 'right');
  column(sc, {
    num: '02', mov: 'Barroco', period: 'Siglo XVII',
    main: 'Nada permanece.', tMain: 3.2,
    sub: 'De la armonía a la complejidad.', tSub: 1.3,
    author: 'Luis de Góngora<br>Francisco de Quevedo<br>Sor Juana Inés de la Cruz', tAuthor: .9,
    chips: ['Fugacidad', 'Apariencia', 'Desengaño', 'Metáfora compleja', 'Paradoja'], tChips: [4.0, 4.6, 5.3, 6.0, 6.8]
  }, b);

  const v = H('div', 'vis', sc);
  const [s, d] = svgIn(v);
  grad(d, 'mg2', 'linearGradient', [[0, '#2c3862'], [.42, '#151c3a'], [.5, '#2b355b'], [.58, '#121933'], [1, '#0c1128']], { x1: 0, y1: 0, x2: 1, y2: 1 });
  grad(d, 'wg2', 'radialGradient', [[0, GOLD, .5], [.6, GOLD, .1], [1, GOLD, 0]]);
  const ec = S('clipPath', { id: 'ec2' }, d); S('ellipse', { cx: 0, cy: 0, rx: 270, ry: 360 }, ec);

  const M = S('g', { transform: 'translate(450,450)' }, s);
  const I = [30, -50], R = 900;
  const P = a => { const r = a * Math.PI / 180; return [I[0] + Math.cos(r) * R, I[1] + Math.sin(r) * R]; };
  const A = [-90, -38, 8, 58, 112, 158, 204, 246];

  const pieces = S('g', null, M);
  A.forEach((a, k) => {
    const a2 = k < A.length - 1 ? A[k + 1] : A[0] + 360, m = (a + a2) / 2;
    const cp = S('clipPath', { id: 'w2_' + k }, d);
    S('polygon', { points: [I, P(a), P(m), P(a2)].map(p => p.map(n => n.toFixed(1)).join(',')).join(' ') }, cp);
    const mv = S('g', { class: 'fb' }, pieces);
    const inner = S('g', { 'clip-path': `url(#w2_${k})` }, mv);
    S('ellipse', { rx: 250, ry: 340, fill: 'url(#mg2)' }, inner);
    S('circle', { cx: 0, cy: -10, r: 150, fill: 'none', stroke: 'rgba(217,182,111,.5)', 'stroke-width': 1.5 }, inner);
    S('ellipse', { rx: 250, ry: 340, fill: 'none', stroke: GOLD, 'stroke-width': 3 }, inner);
    S('ellipse', { rx: 268, ry: 358, fill: 'none', stroke: 'rgba(217,182,111,.45)', 'stroke-width': 1.2 }, inner);
    const mr = m * Math.PI / 180, dist = 22 + (k % 3) * 16;
    K(mv, [[2.7, { transform: 'translate(0px,0px) rotate(0deg)' }, EO],
           [4.3, { transform: `translate(${(Math.cos(mr) * dist).toFixed(1)}px,${(Math.sin(mr) * dist).toFixed(1)}px) rotate(${(k % 2 ? 1 : -1) * (3 + (k % 3) * 2)}deg)` }]], b);
  });
  K(pieces, [[.1, { opacity: 0, transform: 'scale(.94)' }], [1.3, { opacity: 1, transform: 'scale(1)' }]], b);

  const cr = S('g', { 'clip-path': 'url(#ec2)' }, M);
  A.forEach((a, k) => {
    const p = P(a);
    const l = S('path', { d: `M${I[0]},${I[1]} L${p[0].toFixed(1)},${p[1].toFixed(1)}`, stroke: '#EFE8D8', 'stroke-width': 1.6, fill: 'none' }, cr);
    draw(l, 1.8 + k * .03, 2.5 + k * .03, b);
  });
  K(cr, [[2.6, { opacity: 1 }], [3.4, { opacity: 0 }]], b);
  const fl = S('circle', { cx: I[0], cy: I[1], r: 8, fill: '#fff', class: 'fb' }, M);
  K(fl, [[1.6, { opacity: 0, transform: 'scale(.3)' }], [1.75, { opacity: 1, transform: 'scale(1)' }], [2.6, { opacity: 0, transform: 'scale(8)' }]], b);

  // BELLEZA · TIEMPO · MUERTE — light and shadow
  const W = [['BELLEZA', -215, 4.2], ['TIEMPO', 0, 5.4], ['MUERTE', 215, 6.6]];

/* ---------- playback ---------- */
let master, playing = false, hideT;
const $ = id => document.getElementById(id);
const now = () => (master.currentTime || 0) / 1000;
function setT(t) { t = Math.max(0, Math.min(TOTAL, t)); for (const a of anims) a.currentTime = t * 1000; }
function play() { let t = now(); if (t >= TOTAL - .05) t = 0; setT(t); for (const a of anims) a.play(); playing = true; ui(); }
function pause() { const t = now(); for (const a of anims) a.pause(); setT(t); playing = false; ui(); poke(); }
function jump(t) { setT(t); if (playing) for (const a of anims) a.play(); }
function cur() { const t = now(); let k = 0; STARTS.forEach((s, j) => { if (t >= s - .001) k = j; }); return k; }
function next() { const k = cur(); jump(k < 5 ? STARTS[k + 1] + 1 : TOTAL); }
function prev() { const t = now(), k = cur(); if (k === 0) jump(0); else if (t - STARTS[k] > 2.5) jump(STARTS[k] + 1); else jump(k - 1 === 0 ? 0 : STARTS[k - 1] + 1); }
function restart() { jump(0); if (!playing) play(); }
function toggle() { playing ? pause() : play(); }
function full() { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }
function ui() { $('icPause').style.display = playing ? '' : 'none'; $('icPlay').style.display = playing ? 'none' : ''; }
function poke() {
  document.body.classList.add('show');
  clearTimeout(hideT);
  hideT = setTimeout(() => { if (playing) document.body.classList.remove('show'); }, 2600);
}
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${((innerWidth - 1920 * k) / 2).toFixed(2)}px,${((innerHeight - 1080 * k) / 2).toFixed(2)}px) scale(${k})`;
}
function loop() {
  const t = now();
  $('fill').style.width = (t / TOTAL * 100) + '%';
  const k = cur();
  $('sname').textContent = `${k + 1} / 6 · ${NAMES[k]}`;
  if (playing && t >= TOTAL - .001) { playing = false; ui(); poke(); }
  requestAnimationFrame(loop);
}

function init() {
  fit();
  s1(); s2(); s3(); s4(); s5(); s6(); nav();
  master = stage.animate([{ opacity: 1 }, { opacity: 1 }], { duration: TOTAL * 1000, fill: 'forwards' });
  master.pause(); anims.push(master);

  const bar = $('bar');
  STARTS.slice(1).forEach(s => { const t = H('div', 'tick', bar); t.style.left = (s / TOTAL * 100) + '%'; });
  bar.addEventListener('click', e => { const r = bar.getBoundingClientRect(); jump((e.clientX - r.left) / r.width * TOTAL); });
  $('bPlay').onclick = toggle; $('bNext').onclick = next; $('bPrev').onclick = prev;
  $('bRestart').onclick = restart; $('bFull').onclick = full;
  addEventListener('resize', fit);
  addEventListener('mousemove', poke);
  addEventListener('touchstart', poke, { passive: true });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'r' || e.key === 'R') restart();
    else if (e.key === 'f' || e.key === 'F') full();
    else return;
    poke();
  });
  window.__seek = t => { for (const a of anims) a.pause(); playing = false; ui(); setT(t); };

  play(); poke(); loop();
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(init);
})();
